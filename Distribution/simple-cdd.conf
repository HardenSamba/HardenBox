# HardenBox ISO targets Debian 13.x through the stable trixie suite.
CODENAME="trixie"
DI_CODENAME="trixie"
locale="fr_FR.UTF-8"
keyboard="fr(latin9)"

profiles="common sambaad-gui"
build_profiles="kernel-requirements adws-payload"
mirror_tools="download reprepro"
server="deb.debian.org"
debian_mirror="https://deb.debian.org/debian/"
security_mirror="https://security.debian.org/debian-security/"
mirror_components="main"

# Debian 13 no longer publishes installer-i386. Fetch amd64 directly and
# disable the legacy 32-bit UEFI payload expected by simple-cdd 0.6.9.
DI_WWW_HOME="https://deb.debian.org/debian/dists/trixie/main/installer-amd64/current/images"
DISABLE_UEFI_32="1"

local_packages="$PWD/local-packages"

export ARCH="amd64"
export DISKTYPE="DVD"
