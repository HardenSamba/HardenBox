if [ x$feature_default_font_path = xy ]; then
    font=unicode
else
    font=$prefix/font.pf2
fi

if loadfont $font; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    terminal_output gfxterm
fi

set default=0
set timeout=30
set hidden_timeout_quiet

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry 'Installation graphique HardenBox - Francais, AZERTY' {
    set background_color=black
    linux /install.amd/vmlinuz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=fr_FR.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=fr(latin9) keyboard-configuration/layoutcode=fr keyboard-configuration/variantcode=latin9 vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}
menuentry 'Installation graphique HardenBox - Francais, QWERTY' {
    set background_color=black
    linux /install.amd/vmlinuz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=fr_FR.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=us keyboard-configuration/layoutcode=us vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}
menuentry 'HardenBox graphical install - English, QWERTY' {
    set background_color=black
    linux /install.amd/vmlinuz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=en_US.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=us keyboard-configuration/layoutcode=us vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}
menuentry 'HardenBox graphical install - English, AZERTY' {
    set background_color=black
    linux /install.amd/vmlinuz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=en_US.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=fr(latin9) keyboard-configuration/layoutcode=fr keyboard-configuration/variantcode=latin9 vga=788 --- quiet
    initrd /install.amd/gtk/initrd.gz
}
