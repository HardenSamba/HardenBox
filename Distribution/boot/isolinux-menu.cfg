menu hshift 4
menu width 70
menu title HardenBox - Installation graphique
include stdmenu.cfg
include gtk.cfg
label hbfrazerty
	menu label Installation graphique HardenBox - Francais, AZERTY
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=fr_FR.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=fr keyboard-configuration/layoutcode=fr --- quiet
label hbfrqwerty
	menu label Installation graphique HardenBox - Francais, QWERTY
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=fr_FR.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=us keyboard-configuration/layoutcode=us --- quiet
label hbenqwerty
	menu label HardenBox graphical install - English, QWERTY
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=en_US.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=us keyboard-configuration/layoutcode=us --- quiet
label hbenazerty
	menu label HardenBox graphical install - English, AZERTY
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=en_US.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=fr keyboard-configuration/layoutcode=fr --- quiet
label hbenlegacy
	menu label HardenBox graphical install - English, AZERTY (legacy)
	kernel /install.amd/vmlinuz
	append vga=788 initrd=/install.amd/gtk/initrd.gz preseed/file=/cdrom/simple-cdd/default.preseed debian-installer/locale=en_US.UTF-8 console-setup/ask_detect=false keyboard-configuration/xkb-keymap=fr(latin9) keyboard-configuration/layoutcode=fr keyboard-configuration/variantcode=latin9 --- quiet
